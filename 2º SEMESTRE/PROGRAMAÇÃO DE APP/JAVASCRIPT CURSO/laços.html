<html>
    <body>
        <script>
            let n = 0;
            while (n < 10) {
                document.write(n + " o proximo é ");
                n++;
            }

            for(n = 0; n < 10; n++){
                document.write(n + " o proximo é ");
            }
            do {
                document.write(n + " o proximo é ");
                n++;
            } while (n < 10);
        </script>
    </body>
</html>
